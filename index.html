<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LabEvent – Gestionnaire d'événements</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8fafc; }

    /* Calendar day hover */
    .cal-day { transition: background 0.1s ease; }
    .cal-day:hover { background: rgba(59,130,246,0.06) !important; }

    /* Event badge */
    .ev-badge { transition: opacity 0.12s, transform 0.12s; cursor: default; }
    .ev-badge:hover { opacity: 0.85; }

    /* Card hover */
    .ev-card { transition: box-shadow 0.15s, transform 0.15s; }
    .ev-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.1); transform: translateY(-1px); }

    /* Action buttons reveal */
    .action-btn { opacity: 0; transition: opacity 0.15s; }
    .ev-card:hover .action-btn { opacity: 1; }

    /* Modal */
    .modal-bg { animation: fadeIn 0.15s ease; }
    .modal-box { animation: slideUp 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(16px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

    /* Line-clamp polyfill for older browsers */
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* Today pulse */
    .today-dot { animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(59,130,246,0.4); } 50% { box-shadow: 0 0 0 6px rgba(59,130,246,0); } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo, useRef } = React;

    /* ══════════════════════════════════════════════════════
       CONSTANTES
    ══════════════════════════════════════════════════════ */

    const CATEGORIES = {
      work:     { label: 'Travail',    bg: '#3b82f6', light: '#eff6ff', text: '#1d4ed8', border: '#bfdbfe' },
      personal: { label: 'Personnel',  bg: '#22c55e', light: '#f0fdf4', text: '#15803d', border: '#bbf7d0' },
      meeting:  { label: 'Réunion',    bg: '#a855f7', light: '#faf5ff', text: '#7e22ce', border: '#e9d5ff' },
      event:    { label: 'Événement',  bg: '#f97316', light: '#fff7ed', text: '#c2410c', border: '#fed7aa' },
      other:    { label: 'Autre',      bg: '#64748b', light: '#f8fafc', text: '#475569', border: '#e2e8f0' },
    };

    const CAT_KEYS = Object.keys(CATEGORIES);

    const ROOMS = [
      { id: 'corbeille',    name: 'Corbeille',             zone: 'RDC' },
      { id: 'agents',       name: 'Agents de Change',      zone: 'RDC' },
      { id: 'allee-rhone',  name: 'Allée Rhône',           zone: 'RDC' },
      { id: 'lumiere',      name: 'Lumière',               zone: '1er Étage' },
      { id: 'ampere',       name: 'Ampère',                zone: '1er Étage' },
      { id: 'tony-garnier', name: 'Tony Garnier',          zone: '1er Étage' },
      { id: 'jacquard',     name: 'Jacquard',              zone: '1er Étage' },
      { id: 'travaux',      name: 'Travaux / intervention', zone: 'Travaux / Livraison' },
      { id: 'bourse',       name: '20 Rue de la Bourse',   zone: 'Travaux / Livraison' },
      { id: 'cordeliers',   name: 'Place des Cordeliers',  zone: 'Travaux / Livraison' },
      { id: 'grands-ev',    name: 'Grands Événements',     zone: 'Lyon' },
    ];
    const ROOM_MAP = Object.fromEntries(ROOMS.map(r => [r.id, r]));

    const DAYS_FR   = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
    const MONTHS_FR = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

    const TODAY_ISO = new Date().toISOString().split('T')[0];

    const SAMPLE_EVENTS = [
      { id: 's1', title: 'Réunion équipe prod', description: 'Point hebdomadaire de synchronisation', location: 'Salle Confluence', date: '2026-05-25', startTime: '09:00', endTime: '10:00', category: 'meeting' },
      { id: 's2', title: 'Déjeuner client Acme', description: 'Présentation de la roadmap Q3', location: 'Brasserie Le Central', date: '2026-05-27', startTime: '12:30', endTime: '14:00', category: 'work' },
      { id: 's3', title: 'Sprint review', description: 'Démo des features du sprint 14', location: 'Salle Agora', date: '2026-05-28', startTime: '15:00', endTime: '16:30', category: 'meeting' },
      { id: 's4', title: 'Formation React avancé', description: 'Hooks, Suspense et Server Components', location: 'En ligne (Zoom)', date: '2026-05-28', startTime: '09:00', endTime: '12:00', category: 'work' },
      { id: 's5', title: 'Running matinal', description: 'Séance cardio parc de la Tête d\'Or', location: 'Parc de la Tête d\'Or', date: '2026-05-29', startTime: '07:00', endTime: '08:00', category: 'personal' },
      { id: 's6', title: 'Concert Jazz Festival', description: 'Ambrose Akinmusire Quartet', location: 'Théâtre des Célestins', date: '2026-05-30', startTime: '20:30', endTime: '23:00', category: 'event' },
      { id: 's7', title: 'Code review backend', description: 'Revue de l\'API auth & permissions', location: 'Bureau open-space', date: '2026-06-02', startTime: '14:00', endTime: '15:00', category: 'meeting' },
      { id: 's8', title: 'Anniversaire Sophie', description: 'Ne pas oublier le cadeau !', location: 'Chez Sophie', date: '2026-06-05', startTime: '19:00', endTime: '23:00', category: 'personal' },
      { id: 's9', title: 'Conf tech Lyon', description: 'Devoxx France – keynotes & talks', location: 'Centre de Congrès Lyon', date: '2026-06-10', startTime: '09:00', endTime: '18:00', category: 'event' },
      // Événements avec salle (vue planning)
      { id: 'p1', title: 'GROUPE SCAPE',  description: 'Soirée des 100 ans des HUILES BERLIET – AO', date: '2026-05-28', startTime: '07:00', endTime: '23:59', category: 'event',   room: 'corbeille' },
      { id: 'p2', title: 'GROUPE SCAPE',  description: 'Soirée des 100 ans des HUILES BERLIET – AO', date: '2026-05-28', startTime: '07:00', endTime: '23:59', category: 'event',   room: 'agents' },
      { id: 'p3', title: 'Allée Rhône',   description: 'Occupation complète',                         date: '2026-05-28', startTime: '00:00', endTime: '23:59', category: 'work',    room: 'allee-rhone' },
      { id: 'p4', title: 'GROUPE SCAPE',  description: 'Soirée des 100 ans des HUILES BERLIET – AO', date: '2026-05-29', startTime: '07:00', endTime: '23:59', category: 'event',   room: 'corbeille' },
      { id: 'p5', title: 'GROUPE SCAPE',  description: 'Soirée des 100 ans des HUILES BERLIET – AO', date: '2026-05-29', startTime: '07:00', endTime: '23:59', category: 'event',   room: 'agents' },
      { id: 'p6', title: 'LYON DECO',     description: 'Installation déco',                           date: '2026-05-29', startTime: '09:00', endTime: '11:00', category: 'meeting', room: 'corbeille' },
      { id: 'p7', title: 'Conf annuelle', description: 'Conférence entreprise',                       date: '2026-05-29', startTime: '14:00', endTime: '18:00', category: 'work',    room: 'tony-garnier' },
      { id: 'p8', title: 'Gala',          description: 'Gala caritatif',                              date: '2026-05-30', startTime: '19:00', endTime: '23:59', category: 'event',   room: 'lumiere' },
    ];

    /* ══════════════════════════════════════════════════════
       UTILITAIRES DATE
    ══════════════════════════════════════════════════════ */

    const getDaysInMonth = (y, m) => new Date(y, m + 1, 0).getDate();

    const getFirstDayOfWeek = (y, m) => {
      const d = new Date(y, m, 1).getDay();
      return d === 0 ? 6 : d - 1; // lundi = 0
    };

    const toISO = (y, m, d) =>
      `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

    const isTodayFn = (y, m, d) => {
      const t = new Date();
      return t.getFullYear() === y && t.getMonth() === m && t.getDate() === d;
    };

    const formatDateFull = (iso) => {
      if (!iso) return '';
      const d = new Date(iso + 'T12:00:00');
      return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    };

    const formatDateShort = (iso) => {
      if (!iso) return '';
      const d = new Date(iso + 'T12:00:00');
      return { day: d.getDate(), month: d.toLocaleDateString('fr-FR', { month: 'short' }) };
    };

    const uid = () => Math.random().toString(36).substr(2, 9);

    /* ══════════════════════════════════════════════════════
       ICÔNES SVG
    ══════════════════════════════════════════════════════ */

    const Ico = ({ d, size = 16, stroke = 2, fill = 'none', className = '', style = {} }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor"
        strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round"
        className={className} style={style}>
        <path d={d} />
      </svg>
    );

    const IcoChevLeft  = (p) => <Ico {...p} d="M15 18l-6-6 6-6" />;
    const IcoChevRight = (p) => <Ico {...p} d="M9 18l6-6-6-6" />;
    const IcoPlus      = (p) => <Ico {...p} d="M12 5v14M5 12h14" />;
    const IcoX         = (p) => <Ico {...p} d="M18 6L6 18M6 6l12 12" />;
    const IcoPencil    = (p) => <Ico {...p} d="M17 3a2.83 2.83 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z" />;
    const IcoTrash     = (p) => <Ico {...p} d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />;
    const IcoClock     = (p) => <Ico {...p} d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zm0-14v4l3 1.5" />;
    const IcoPin       = (p) => <Ico {...p} d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0zm-9 3a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" />;
    const IcoCalendar  = (p) => <Ico {...p} d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" />;
    const IcoList      = (p) => <Ico {...p} d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01" />;
    const IcoSearch    = (p) => <Ico {...p} d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z" />;
    const IcoGrid      = (p) => <Ico {...p} d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z" />;

    /* ══════════════════════════════════════════════════════
       BADGE CATÉGORIE
    ══════════════════════════════════════════════════════ */

    function CatBadge({ cat, active, onClick }) {
      const c = CATEGORIES[cat];
      return (
        <button type="button" onClick={onClick}
          style={{
            background: active ? c.bg : c.light,
            color: active ? '#fff' : c.text,
            border: `1.5px solid ${active ? c.bg : c.border}`,
          }}
          className="px-3 py-1 rounded-full text-xs font-semibold transition-all hover:opacity-90">
          {c.label}
        </button>
      );
    }

    /* ══════════════════════════════════════════════════════
       MODAL CRÉER / MODIFIER
    ══════════════════════════════════════════════════════ */

    function EventModal({ event, initialDate, onSave, onClose }) {
      const isEdit = Boolean(event);
      const [form, setForm] = useState({
        title:       event?.title       ?? '',
        description: event?.description ?? '',
        location:    event?.location    ?? '',
        date:        event?.date        ?? initialDate ?? TODAY_ISO,
        startTime:   event?.startTime   ?? '09:00',
        endTime:     event?.endTime     ?? '10:00',
        category:    event?.category    ?? 'work',
        room:        event?.room        ?? '',
      });
      const [error, setError] = useState('');
      const titleRef = useRef(null);

      useEffect(() => {
        titleRef.current?.focus();
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const set = (f) => (e) => setForm(p => ({ ...p, [f]: e.target.value }));

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!form.title.trim()) { setError('Le titre est requis.'); return; }
        if (form.startTime >= form.endTime) { setError('L\'heure de fin doit être après le début.'); return; }
        onSave({ ...form, title: form.title.trim(), id: event?.id ?? uid() });
      };

      return (
        <div className="modal-bg fixed inset-0 z-50 flex items-center justify-center p-4"
          style={{ background: 'rgba(15,23,42,0.6)' }}
          onClick={onClose}>
          <div className="modal-box bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden"
            onClick={e => e.stopPropagation()}>

            {/* Header modal */}
            <div className="flex items-center justify-between px-6 py-4 border-b border-slate-100">
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 rounded-lg flex items-center justify-center"
                  style={{ background: CATEGORIES[form.category].light, color: CATEGORIES[form.category].bg }}>
                  <IcoCalendar size={15} />
                </div>
                <h2 className="font-bold text-slate-900 text-lg">
                  {isEdit ? 'Modifier l\'événement' : 'Nouvel événement'}
                </h2>
              </div>
              <button onClick={onClose} className="p-2 rounded-xl text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition-colors">
                <IcoX size={18} />
              </button>
            </div>

            {/* Formulaire */}
            <form onSubmit={handleSubmit}>
              <div className="px-6 py-5 space-y-4 max-h-[70vh] overflow-y-auto">

                {/* Titre */}
                <div>
                  <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Titre *</label>
                  <input ref={titleRef} type="text" value={form.title} onChange={set('title')}
                    placeholder="Nom de l'événement"
                    className="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                  />
                </div>

                {/* Catégorie */}
                <div>
                  <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Catégorie</label>
                  <div className="flex gap-2 flex-wrap">
                    {CAT_KEYS.map(k => (
                      <CatBadge key={k} cat={k} active={form.category === k}
                        onClick={() => setForm(p => ({ ...p, category: k }))} />
                    ))}
                  </div>
                </div>

                {/* Date */}
                <div>
                  <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Date</label>
                  <input type="date" value={form.date} onChange={set('date')}
                    className="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                  />
                </div>

                {/* Heures */}
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Début</label>
                    <input type="time" value={form.startTime} onChange={set('startTime')}
                      className="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Fin</label>
                    <input type="time" value={form.endTime} onChange={set('endTime')}
                      className="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                    />
                  </div>
                </div>

                {/* Lieu */}
                <div>
                  <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Salle / Espace</label>
                  <select value={form.room} onChange={set('room')}
                    className="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 transition bg-white">
                    <option value="">— Aucune salle —</option>
                    {(() => {
                      const zones = {};
                      ROOMS.forEach(r => { if (!zones[r.zone]) zones[r.zone] = []; zones[r.zone].push(r); });
                      return Object.entries(zones).map(([zone, rooms]) => (
                        <optgroup key={zone} label={zone}>
                          {rooms.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
                        </optgroup>
                      ));
                    })()}
                  </select>
                </div>

                {/* Lieu libre */}
                <div>
                  <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Lieu (libre)</label>
                  <div className="relative">
                    <IcoPin size={14} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" />
                    <input type="text" value={form.location} onChange={set('location')}
                      placeholder="Adresse, lien visio…"
                      className="w-full border border-slate-200 rounded-xl pl-9 pr-4 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                    />
                  </div>
                </div>

                {/* Description */}
                <div>
                  <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Description</label>
                  <textarea value={form.description} onChange={set('description')} rows={3}
                    placeholder="Notes, ordre du jour, liens…"
                    className="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 transition resize-none"
                  />
                </div>

                {error && (
                  <p className="text-red-500 text-sm font-medium bg-red-50 border border-red-200 rounded-lg px-3 py-2">{error}</p>
                )}
              </div>

              {/* Footer modal */}
              <div className="px-6 py-4 border-t border-slate-100 flex gap-3">
                <button type="button" onClick={onClose}
                  className="flex-1 px-4 py-2.5 border border-slate-200 text-slate-600 text-sm font-semibold rounded-xl hover:bg-slate-50 transition-colors">
                  Annuler
                </button>
                <button type="submit"
                  className="flex-1 px-4 py-2.5 text-white text-sm font-semibold rounded-xl transition-colors"
                  style={{ background: CATEGORIES[form.category].bg }}>
                  {isEdit ? 'Enregistrer' : 'Créer l\'événement'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    /* ══════════════════════════════════════════════════════
       CARTE ÉVÉNEMENT
    ══════════════════════════════════════════════════════ */

    function EventCard({ ev, onEdit, onDelete, compact = false }) {
      const c = CATEGORIES[ev.category] || CATEGORIES.other;
      return (
        <div className="ev-card rounded-xl p-3 relative"
          style={{ background: c.light, border: `1.5px solid ${c.border}` }}>
          <div className="flex items-start gap-2">
            <span className="w-2.5 h-2.5 rounded-full mt-0.5 flex-shrink-0" style={{ background: c.bg }} />
            <div className="flex-1 min-w-0">
              <div className="flex items-center justify-between gap-2">
                <span className="text-xs font-semibold" style={{ color: c.text }}>{c.label}</span>
                <div className="flex gap-1">
                  <button onClick={() => onEdit(ev)}
                    className="action-btn p-1 rounded-lg hover:bg-white transition-colors" style={{ color: c.text }}>
                    <IcoPencil size={12} />
                  </button>
                  <button onClick={() => onDelete(ev.id)}
                    className="action-btn p-1 rounded-lg hover:bg-white transition-colors text-red-400">
                    <IcoTrash size={12} />
                  </button>
                </div>
              </div>
              <p className="font-bold text-slate-900 text-sm mt-0.5 truncate">{ev.title}</p>
              <div className="flex items-center gap-1 mt-1">
                <IcoClock size={11} className="text-slate-400 flex-shrink-0" />
                <span className="text-xs text-slate-500">{ev.startTime} – {ev.endTime}</span>
              </div>
              {!compact && ev.location && (
                <div className="flex items-center gap-1 mt-0.5">
                  <IcoPin size={11} className="text-slate-400 flex-shrink-0" />
                  <span className="text-xs text-slate-500 truncate">{ev.location}</span>
                </div>
              )}
              {!compact && ev.description && (
                <p className="text-xs text-slate-500 mt-1.5 line-clamp-2">{ev.description}</p>
              )}
            </div>
          </div>
        </div>
      );
    }

    /* ══════════════════════════════════════════════════════
       GRILLE CALENDRIER
    ══════════════════════════════════════════════════════ */

    function CalendarGrid({ year, month, eventsMap, selectedDate, onSelect, onCreate }) {
      const daysInMonth  = getDaysInMonth(year, month);
      const firstDayIdx  = getFirstDayOfWeek(year, month);
      const prevDays     = getDaysInMonth(year, month - 1 < 0 ? 11 : month - 1);

      // Construire les 42 cellules
      const cells = useMemo(() => {
        const arr = [];
        // Jours mois précédent
        for (let i = firstDayIdx - 1; i >= 0; i--) {
          const d = prevDays - i;
          const m = month === 0 ? 11 : month - 1;
          const y = month === 0 ? year - 1 : year;
          arr.push({ day: d, month: m, year: y, current: false });
        }
        // Jours du mois courant
        for (let d = 1; d <= daysInMonth; d++) {
          arr.push({ day: d, month, year, current: true });
        }
        // Jours mois suivant
        let nd = 1;
        while (arr.length < 42) {
          const m = month === 11 ? 0 : month + 1;
          const y = month === 11 ? year + 1 : year;
          arr.push({ day: nd++, month: m, year: y, current: false });
        }
        return arr;
      }, [year, month]);

      return (
        <div className="bg-white rounded-2xl shadow-sm overflow-hidden" style={{ border: '1px solid #e2e8f0' }}>
          {/* En-têtes jours */}
          <div className="grid grid-cols-7 border-b border-slate-100" style={{ background: '#f8fafc' }}>
            {DAYS_FR.map((d, i) => (
              <div key={d} className={`py-3 text-center text-xs font-bold uppercase tracking-widest
                ${i >= 5 ? 'text-blue-400' : 'text-slate-400'}`}>
                {d}
              </div>
            ))}
          </div>

          {/* Cellules */}
          <div className="grid grid-cols-7">
            {cells.map((cell, idx) => {
              const iso     = toISO(cell.year, cell.month, cell.day);
              const dayEvs  = eventsMap[iso] || [];
              const isToday = isTodayFn(cell.year, cell.month, cell.day);
              const isSel   = selectedDate === iso;
              const isWeek  = idx % 7 >= 5;

              return (
                <div key={idx}
                  className="cal-day relative border-b border-r border-slate-100 cursor-pointer"
                  style={{
                    minHeight: 90,
                    background: isSel
                      ? '#eff6ff'
                      : !cell.current
                      ? '#fafafa'
                      : isWeek
                      ? 'rgba(239,246,255,0.3)'
                      : '#fff',
                    outline: isSel ? '2px solid #3b82f6' : 'none',
                    outlineOffset: '-2px',
                  }}
                  onClick={() => onSelect(iso)}
                  onDoubleClick={() => onCreate(iso)}>

                  <div className="p-1.5">
                    {/* Numéro du jour */}
                    <div className="flex items-center justify-between mb-1">
                      <span className={`w-7 h-7 flex items-center justify-center rounded-full text-sm font-bold
                        ${isToday ? 'today-dot text-white' : ''}
                        ${!isToday && !cell.current ? 'text-slate-300' : ''}
                        ${!isToday && cell.current && isWeek ? 'text-blue-500' : ''}
                        ${!isToday && cell.current && !isWeek ? 'text-slate-700' : ''}
                      `}
                      style={isToday ? { background: '#3b82f6' } : {}}>
                        {cell.day}
                      </span>
                      {dayEvs.length > 0 && (
                        <span className="text-xs font-bold rounded-full px-1.5 py-0.5"
                          style={{ background: '#dbeafe', color: '#1d4ed8', fontSize: 10 }}>
                          {dayEvs.length}
                        </span>
                      )}
                    </div>

                    {/* Badges événements */}
                    <div className="space-y-0.5">
                      {dayEvs.slice(0, 3).map(ev => {
                        const c = CATEGORIES[ev.category] || CATEGORIES.other;
                        return (
                          <div key={ev.id} className="ev-badge text-white text-xs rounded-md px-1.5 py-0.5 truncate leading-tight"
                            style={{ background: c.bg, fontSize: 10 }}>
                            <span className="opacity-80">{ev.startTime}</span> {ev.title}
                          </div>
                        );
                      })}
                      {dayEvs.length > 3 && (
                        <div className="text-xs text-slate-400 px-1" style={{ fontSize: 10 }}>
                          +{dayEvs.length - 3} autres
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    /* ══════════════════════════════════════════════════════
       PANNEAU LATÉRAL
    ══════════════════════════════════════════════════════ */

    function Sidebar({ selectedDate, eventsMap, allEvents, onEdit, onDelete, onCreate }) {

        (eventsMap[selectedDate] || [])
          .sort((a, b) => a.startTime.localeCompare(b.startTime)),
        [eventsMap, selectedDate]
      );

      const upcoming = useMemo(() =>
        allEvents
          .filter(e => e.date > (selectedDate || TODAY_ISO))
          .sort((a, b) => a.date.localeCompare(b.date) || a.startTime.localeCompare(b.startTime))
          .slice(0, 6),
        [allEvents, selectedDate]
      );

      return (
        <div className="space-y-4 flex flex-col">
          {/* Événements du jour sélectionné */}
          <div className="bg-white rounded-2xl shadow-sm overflow-hidden flex-1" style={{ border: '1px solid #e2e8f0' }}>
            <div className="px-4 py-3 border-b border-slate-100 flex items-start justify-between gap-2">
              <div>
                <p className="text-xs text-slate-500 uppercase tracking-wider font-semibold">Jour sélectionné</p>
                <h3 className="font-bold text-slate-900 text-sm mt-0.5 capitalize">
                  {formatDateFull(selectedDate)}
                </h3>

                style={{ background: '#3b82f6' }}>
                <IcoPlus size={13} />
                Ajouter
              </button>

            <div className="p-4 space-y-3 overflow-y-auto" style={{ maxHeight: 320 }}>
              {dayEvs.length === 0 ? (

                    style={{ background: '#f1f5f9' }}>
                    <IcoCalendar size={22} className="text-slate-300" />
                  </div>
                  <p className="text-sm text-slate-400 font-medium">Aucun événement</p>
                  <button onClick={() => onCreate(selectedDate)}
                    className="mt-2 text-xs font-semibold" style={{ color: '#3b82f6' }}>
                    Créer un événement →

                dayEvs.map(ev => (
                  <EventCard key={ev.id} ev={ev} onEdit={onEdit} onDelete={onDelete} />

          </div>

          {/* Prochains événements */}
          {upcoming.length > 0 && (
            <div className="bg-white rounded-2xl shadow-sm overflow-hidden" style={{ border: '1px solid #e2e8f0' }}>
              <div className="px-4 py-3 border-b border-slate-100">
                <p className="text-xs text-slate-500 uppercase tracking-wider font-semibold">À venir</p>

              <div className="p-4 space-y-3 overflow-y-auto" style={{ maxHeight: 280 }}>
                {upcoming.map(ev => {
                  const { day, month } = formatDateShort(ev.date);
                  const c = CATEGORIES[ev.category] || CATEGORIES.other;
                  return (
                    <div key={ev.id} className="flex gap-3 items-start group cursor-pointer"
                      onClick={() => onEdit(ev)}>
                      <div className="flex-shrink-0 w-10 h-10 rounded-xl flex flex-col items-center justify-center"

    /* ══════════════════════════════════════════════════════
       VUE LISTE
    ══════════════════════════════════════════════════════ */

    function ListView({ events, onEdit, onDelete, onCreate, searchQuery }) {
      const filtered = useMemo(() => {
        const q = searchQuery.toLowerCase().trim();
        return events
          .filter(e => !q || e.title.toLowerCase().includes(q) || (e.description || '').toLowerCase().includes(q) || (e.location || '').toLowerCase().includes(q))
          .sort((a, b) => a.date.localeCompare(b.date) || a.startTime.localeCompare(b.startTime));
      }, [events, searchQuery]);

      // Grouper par date
      const grouped = useMemo(() => {
        const g = {};
        filtered.forEach(e => {
          if (!g[e.date]) g[e.date] = [];
          g[e.date].push(e);
        });
        return Object.entries(g).sort(([a], [b]) => a.localeCompare(b));
      }, [filtered]);

      if (grouped.length === 0) {
        return (
          <div className="bg-white rounded-2xl flex flex-col items-center justify-center py-20 shadow-sm" style={{ border: '1px solid #e2e8f0' }}>
            <div className="w-16 h-16 rounded-2xl flex items-center justify-center mb-4" style={{ background: '#f1f5f9' }}>
              <IcoList size={28} className="text-slate-300" />
            </div>
            <p className="text-slate-500 font-medium">Aucun événement trouvé</p>
            <button onClick={() => onCreate(TODAY_ISO)} className="mt-3 text-sm font-semibold" style={{ color: '#3b82f6' }}>
              Créer un événement →
            </button>
          </div>
        );
      }

      return (
        <div className="space-y-6">
          {grouped.map(([date, evs]) => (
            <div key={date}>
              <div className="flex items-center gap-3 mb-3">
                <div className="flex items-center gap-2">
                  {isTodayFn(...date.split('-').map((v, i) => i === 1 ? +v - 1 : +v)) && (
                    <span className="text-xs font-bold px-2 py-0.5 rounded-full text-white" style={{ background: '#3b82f6' }}>Aujourd'hui</span>
                  )}
                  <span className="font-bold text-slate-900 capitalize">{formatDateFull(date)}</span>
                </div>
                <div className="flex-1 h-px" style={{ background: '#e2e8f0' }} />
                <span className="text-xs text-slate-400 font-medium">{evs.length} événement{evs.length > 1 ? 's' : ''}</span>
              </div>
              <div className="grid gap-3 sm:grid-cols-2">
                {evs.map(ev => (
                  <EventCard key={ev.id} ev={ev} onEdit={onEdit} onDelete={onDelete} />
                ))}
              </div>
            </div>
          ))}
        </div>
      );
    }

    /* ══════════════════════════════════════════════════════
       VUE PLANNING (GANTT SALLES)
    ══════════════════════════════════════════════════════ */

    function PlanningView({ events, planningDate, onDateChange, onEdit, onCreate }) {
      const CW = 54;   // px par heure
      const RH = 36;   // px par ligne
      const DW = 64;   // col date
      const ZW = 88;   // col zone
      const NW = 138;  // col nom salle
      const HOURS = Array.from({ length: 24 }, (_, i) => i);

      // Semaine : 7 jours depuis planningDate
      const days = useMemo(() => {
        const start = new Date(planningDate + 'T12:00:00');
        return Array.from({ length: 7 }, (_, i) => {
          const d = new Date(start); d.setDate(d.getDate() + i);
          const iso = d.toISOString().split('T')[0];
          return {
            iso,
            num:   d.getDate(),
            wday:  d.toLocaleDateString('fr-FR', { weekday: 'short' }),
            month: d.toLocaleDateString('fr-FR', { month: 'short' }),
            isToday: iso === TODAY_ISO,
          };
        });
      }, [planningDate]);

      // Zones et salles
      const zones = useMemo(() => {
        const z = {};
        ROOMS.forEach(r => { if (!z[r.zone]) z[r.zone] = []; z[r.zone].push(r); });
        return Object.entries(z);
      }, []);

      // Lignes aplaties avec rowspan
      const rows = useMemo(() => {
        const result = [];
        days.forEach(day => {
          let firstDay = true;
          zones.forEach(([zoneName, zoneRooms]) => {
            let firstZone = true;
            zoneRooms.forEach(room => {
              const dayEvs = events.filter(e => e.date === day.iso && e.room === room.id);
              result.push({ day, zoneName, room, dayEvs, firstDay, firstZone,
                daySpan: ROOMS.length, zoneSpan: zoneRooms.length });
              firstDay = false; firstZone = false;
            });
          });
        });
        return result;
      }, [days, events, zones]);

      const navWeek = (delta) => {
        const d = new Date(planningDate + 'T12:00:00');
        d.setDate(d.getDate() + delta * 7);
        onDateChange(d.toISOString().split('T')[0]);
      };

      const goToday = () => {
        const t = new Date();
        const dow = t.getDay() || 7;
        const mon = new Date(t); mon.setDate(t.getDate() - dow + 1);
        onDateChange(mon.toISOString().split('T')[0]);
      };

      const evPos = (ev) => {
        const [sh, sm] = ev.startTime.split(':').map(Number);
        const [eh, em] = ev.endTime.split(':').map(Number);
        const s = sh + sm / 60;
        let e2 = eh + em / 60;
        if (e2 <= s) e2 = 24;
        return { left: Math.round(s * CW), width: Math.max(Math.round((e2 - s) * CW) - 2, 20) };
      };

      const S = (obj) => ({ ...obj });
      const cellBorder = '1px solid #e2e8f0';
      const stickyBase = { position: 'sticky', zIndex: 12, background: '#fff' };

      return (
        <div>
          {/* Nav semaine */}
          <div className="flex items-center gap-2 mb-4">
            <button onClick={() => navWeek(-1)} className="p-2 border rounded-xl hover:bg-slate-50 transition-colors" style={{ borderColor: '#e2e8f0' }}>
              <IcoChevLeft size={15} className="text-slate-600" />
            </button>
            <span className="font-bold text-slate-800 text-sm px-1">
              {days[0]?.wday} {days[0]?.num} – {days[6]?.wday} {days[6]?.num} {days[0]?.month} {new Date(planningDate + 'T12:00:00').getFullYear()}
            </span>
            <button onClick={() => navWeek(1)} className="p-2 border rounded-xl hover:bg-slate-50 transition-colors" style={{ borderColor: '#e2e8f0' }}>
              <IcoChevRight size={15} className="text-slate-600" />
            </button>
            <button onClick={goToday} className="px-3 py-1.5 border rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-50 transition-colors ml-1" style={{ borderColor: '#e2e8f0' }}>
              Cette semaine
            </button>
            <span className="ml-auto text-xs text-slate-400 hidden sm:block">Double-clic sur une case pour créer</span>
          </div>

          {/* Tableau */}
          <div style={{ overflowX: 'auto', overflowY: 'auto', maxHeight: 'calc(100vh - 200px)', border: cellBorder, borderRadius: 12 }}>
            <table style={{ borderCollapse: 'collapse', tableLayout: 'fixed',
              minWidth: DW + ZW + NW + 24 * CW, width: DW + ZW + NW + 24 * CW }}>
              <colgroup>
                <col style={{ width: DW }} />
                <col style={{ width: ZW }} />
                <col style={{ width: NW }} />
                {HOURS.map(h => <col key={h} style={{ width: CW }} />)}
              </colgroup>

              {/* En-tête heures */}
              <thead>
                <tr style={{ position: 'sticky', top: 0, zIndex: 20 }}>
                  <th style={{ ...stickyBase, left: 0, width: DW, border: cellBorder, background: '#f8fafc', padding: '6px 4px', fontSize: 11, color: '#94a3b8', fontWeight: 700 }}>Date</th>
                  <th style={{ ...stickyBase, left: DW, width: ZW, border: cellBorder, background: '#f8fafc', padding: '6px 4px', fontSize: 11, color: '#94a3b8', fontWeight: 700 }}>Zone</th>
                  <th style={{ ...stickyBase, left: DW + ZW, width: NW, border: cellBorder, background: '#f8fafc', padding: '6px 8px', fontSize: 11, color: '#94a3b8', fontWeight: 700, textAlign: 'left' }}>Salle</th>
                  {HOURS.map(h => (
                    <th key={h} style={{
                      width: CW, border: cellBorder, padding: '6px 0', textAlign: 'center',
                      fontSize: 10, fontWeight: 600,
                      color: h < 7 || h >= 22 ? '#94a3b8' : h >= 8 && h < 20 ? '#64748b' : '#94a3b8',
                      background: h >= 8 && h < 20 ? '#f8fafc' : '#f1f5f9',
                    }}>
                      {String(h).padStart(2, '0')}
                    </th>
                  ))}
                </tr>
              </thead>

              <tbody>
                {rows.map((row, idx) => (
                  <tr key={idx} style={{ height: RH }}>
                    {/* Cellule date (rowspan = nb salles total) */}
                    {row.firstDay && (
                      <td rowSpan={row.daySpan} style={{
                        ...stickyBase, left: 0, width: DW,
                        border: cellBorder, verticalAlign: 'middle', textAlign: 'center',
                        padding: '4px 2px',
                        borderLeft: row.day.isToday ? '3px solid #3b82f6' : cellBorder,
                      }}>
                        <div style={{ fontWeight: 900, fontSize: 16, lineHeight: 1, color: row.day.isToday ? '#3b82f6' : '#1e293b' }}>{row.day.num}</div>
                        <div style={{ fontSize: 10, color: '#64748b', textTransform: 'capitalize', marginTop: 2 }}>{row.day.wday}.</div>
                        <div style={{ fontSize: 9, color: '#94a3b8' }}>{row.day.month}</div>
                      </td>
                    )}

                    {/* Cellule zone (rowspan = nb salles dans cette zone) */}
                    {row.firstZone && (
                      <td rowSpan={row.zoneSpan} style={{
                        ...stickyBase, left: DW, width: ZW,
                        border: cellBorder, verticalAlign: 'middle', textAlign: 'center',
                        padding: '4px',
                        background: '#f8fafc',
                      }}>
                        <span style={{ fontSize: 10, fontWeight: 800, color: '#475569', textTransform: 'uppercase', letterSpacing: '0.04em', writingMode: 'horizontal-tb' }}>
                          {row.zoneName}
                        </span>
                      </td>
                    )}

                    {/* Cellule nom salle */}
                    <td style={{
                      ...stickyBase, left: DW + ZW, width: NW,
                      border: cellBorder, padding: '0 8px',
                      fontSize: 11, fontWeight: 600, color: '#334155',
                      whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
                      verticalAlign: 'middle',
                    }}>
                      {row.room.name}
                    </td>

                    {/* Cellule timeline (colspan = 24) */}
                    <td colSpan={24} style={{
                      position: 'relative', border: cellBorder, padding: 0,
                      width: 24 * CW, height: RH,
                      background: '#fff',
                    }}
                      onDoubleClick={(e) => {
                        const rect = e.currentTarget.getBoundingClientRect();
                        const h = Math.floor((e.clientX - rect.left) / CW);
                        const sh = String(h).padStart(2,'0') + ':00';
                        const eh = String(Math.min(h + 1, 23)).padStart(2,'0') + ':00';
                        onCreate({ date: row.day.iso, room: row.room.id, startTime: sh, endTime: eh });
                      }}>
                      {/* Grille heures */}
                      <div style={{
                        position: 'absolute', inset: 0, pointerEvents: 'none',
                        backgroundImage: `repeating-linear-gradient(90deg,transparent 0,transparent ${CW-1}px,#e2e8f0 ${CW-1}px,#e2e8f0 ${CW}px)`,
                      }} />
                      {/* Zone horaire bureau */}
                      <div style={{ position: 'absolute', left: 8*CW, width: 12*CW, top:0, bottom:0, background:'rgba(248,250,252,0.7)', pointerEvents:'none' }} />
                      {/* Événements */}
                      {row.dayEvs.map(ev => {
                        const { left, width } = evPos(ev);
                        const cat = CATEGORIES[ev.category] || CATEGORIES.other;
                        return (
                          <div key={ev.id} onClick={(e) => { e.stopPropagation(); onEdit(ev); }}
                            style={{
                              position: 'absolute', left: left + 1, width, top: 3, bottom: 3,
                              background: cat.bg, borderRadius: 4, cursor: 'pointer',
                              display: 'flex', alignItems: 'center', padding: '0 5px', zIndex: 5,
                              overflow: 'hidden',
                            }}>
                            <span style={{ color:'#fff', fontSize:10, fontWeight:700, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
                              {ev.startTime}–{ev.endTime} {ev.title}
                            </span>
                          </div>
                        );
                      })}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    /* ══════════════════════════════════════════════════════
       APPLICATION PRINCIPALE
    ══════════════════════════════════════════════════════ */

    function App() {
      const now = new Date();
      const [view, setView] = useState('calendar'); // 'calendar' | 'planning' | 'list'
      const [navDate, setNavDate] = useState({ year: now.getFullYear(), month: now.getMonth() });
      const [planningDate, setPlanningDate] = useState(() => {
        const dow = now.getDay() || 7;
        const mon = new Date(now); mon.setDate(now.getDate() - dow + 1);
        return mon.toISOString().split('T')[0];
      });
      const [selected, setSelected] = useState(TODAY_ISO);
      const [searchQuery, setSearchQuery] = useState('');
      const [events, setEvents] = useState(() => {
        try { const s = localStorage.getItem('labevent'); return s ? JSON.parse(s) : SAMPLE_EVENTS; }
        catch { return SAMPLE_EVENTS; }
      });
      const [modal, setModal] = useState(null); // null | { event?, initialDate? }
      const [deleteConfirm, setDeleteConfirm] = useState(null);

      useEffect(() => {
        localStorage.setItem('labevent', JSON.stringify(events));
      }, [events]);

      const eventsMap = useMemo(() => {
        const m = {};
        events.forEach(e => { if (!m[e.date]) m[e.date] = []; m[e.date].push(e); });
        return m;
      }, [events]);

      const monthEvents = useMemo(() =>
        events.filter(e => {
          const [y, mo] = e.date.split('-').map(Number);
          return y === navDate.year && mo - 1 === navDate.month;
        }),
        [events, navDate]
      );

      const handlePrev = () => setNavDate(({ year, month }) => ({
        year: month === 0 ? year - 1 : year,
        month: month === 0 ? 11 : month - 1,
      }));

      const handleNext = () => setNavDate(({ year, month }) => ({
        year: month === 11 ? year + 1 : year,
        month: month === 11 ? 0 : month + 1,
      }));

      const handleToday = () => {
        setNavDate({ year: now.getFullYear(), month: now.getMonth() });
        setSelected(TODAY_ISO);
      };

      const handleSave = (evData) => {
        setEvents(prev => {
          const idx = prev.findIndex(e => e.id === evData.id);
          if (idx >= 0) { const next = [...prev]; next[idx] = evData; return next; }
          return [...prev, evData];
        });
        setModal(null);
      };

      const handleDelete = (id) => {
        setEvents(prev => prev.filter(e => e.id !== id));
        setDeleteConfirm(null);
      };

      const askDelete = (id) => setDeleteConfirm(id);

      // Stats du mois
      const catStats = useMemo(() =>
        CAT_KEYS.map(k => ({ key: k, count: monthEvents.filter(e => e.category === k).length }))
          .filter(s => s.count > 0),
        [monthEvents]
      );

      return (
        <div className="min-h-screen flex flex-col" style={{ background: '#f1f5f9' }}>

          {/* ── HEADER ── */}
          <header className="sticky top-0 z-40 bg-white border-b" style={{ borderColor: '#e2e8f0', boxShadow: '0 1px 3px rgba(0,0,0,0.06)' }}>
            <div className="max-w-screen-xl mx-auto px-4 sm:px-6">
              <div className="flex items-center gap-4 py-3">

                {/* Logo */}
                <div className="flex items-center gap-2.5 flex-shrink-0">
                  <div className="w-9 h-9 rounded-xl flex items-center justify-center" style={{ background: '#3b82f6' }}>
                    <IcoCalendar size={18} className="text-white" />
                  </div>
                  <div>
                    <h1 className="font-black text-slate-900 leading-none text-lg">LabEvent</h1>
                    <p className="text-xs text-slate-400 leading-none mt-0.5">Planning manager</p>
                  </div>
                </div>

                {/* Navigation mois (calendrier seulement) */}
                {view === 'calendar' && (
                  <div className="flex items-center rounded-xl overflow-hidden ml-4" style={{ background: '#f1f5f9' }}>
                    <button onClick={handlePrev} className="p-2.5 hover:bg-slate-200 transition-colors">
                      <IcoChevLeft size={16} className="text-slate-600" />
                    </button>
                    <span className="px-4 font-bold text-slate-900 text-sm min-w-[148px] text-center">
                      {MONTHS_FR[navDate.month]} {navDate.year}
                    </span>
                    <button onClick={handleNext} className="p-2.5 hover:bg-slate-200 transition-colors">
                      <IcoChevRight size={16} className="text-slate-600" />
                    </button>
                  </div>
                )}

                {/* Recherche (liste seulement) */}
                {view === 'list' && (
                  <div className="relative flex-1 max-w-sm ml-4">
                    <IcoSearch size={14} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" />
                    <input type="text" value={searchQuery} onChange={e => setSearchQuery(e.target.value)}
                      placeholder="Rechercher un événement…"
                      className="w-full pl-9 pr-4 py-2 text-sm border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                      style={{ borderColor: '#e2e8f0' }}
                    />
                  </div>
                )}

                <div className="flex items-center gap-2 ml-auto">
                  {/* Bouton Aujourd'hui */}
                  <button onClick={handleToday}
                    className="hidden sm:inline-flex px-3 py-2 text-sm font-semibold text-slate-600 border rounded-xl hover:bg-slate-50 transition-colors"
                    style={{ borderColor: '#e2e8f0' }}>
                    Aujourd'hui
                  </button>

                  {/* Toggle vue */}
                  <div className="flex rounded-xl overflow-hidden" style={{ background: '#f1f5f9' }}>
                    <button onClick={() => setView('calendar')} title="Vue calendrier"
                      className={`p-2.5 transition-colors ${view === 'calendar' ? 'bg-blue-600 text-white' : 'text-slate-500 hover:bg-slate-200'}`}>
                      <IcoCalendar size={16} />
                    </button>
                    <button onClick={() => setView('planning')} title="Vue planning"
                      className={`p-2.5 transition-colors ${view === 'planning' ? 'bg-blue-600 text-white' : 'text-slate-500 hover:bg-slate-200'}`}>
                      <IcoGrid size={16} />
                    </button>
                    <button onClick={() => setView('list')} title="Vue liste"
                      className={`p-2.5 transition-colors ${view === 'list' ? 'bg-blue-600 text-white' : 'text-slate-500 hover:bg-slate-200'}`}>
                      <IcoList size={16} />
                    </button>
                  </div>

                  {/* Nouvel événement */}
                  <button onClick={() => setModal({ initialDate: selected })}
                    className="flex items-center gap-2 px-4 py-2 text-white text-sm font-bold rounded-xl hover:opacity-90 transition-opacity"
                    style={{ background: '#3b82f6' }}>
                    <IcoPlus size={16} />
                    <span className="hidden sm:inline">Nouvel événement</span>
                  </button>
                </div>
              </div>

              {/* Barre stats (vue calendrier) */}
              {view === 'calendar' && (
                <div className="flex items-center gap-4 pb-2.5 overflow-x-auto">
                  <span className="text-xs text-slate-400 font-medium flex-shrink-0">
                    {monthEvents.length} événement{monthEvents.length !== 1 ? 's' : ''} ce mois
                  </span>
                  <div className="w-px h-4 bg-slate-200 flex-shrink-0" />
                  {catStats.map(({ key, count }) => {
                    const c = CATEGORIES[key];
                    return (
                      <div key={key} className="flex items-center gap-1.5 flex-shrink-0">
                        <span className="w-2 h-2 rounded-full" style={{ background: c.bg }} />
                        <span className="text-xs text-slate-500">{c.label} <strong className="text-slate-700">{count}</strong></span>
                      </div>
                    );
                  })}
                  <span className="ml-auto text-xs text-slate-400 hidden sm:block flex-shrink-0">
                    Double-clic sur un jour pour créer
                  </span>
                </div>
              )}
            </div>
          </header>

          {/* ── CONTENU PRINCIPAL ── */}
          <main className="flex-1 max-w-screen-xl mx-auto w-full px-4 sm:px-6 py-6">
            {view === 'calendar' && (
              <div className="flex gap-6">
                <div className="flex-1 min-w-0">
                  <CalendarGrid
                    year={navDate.year} month={navDate.month}
                    eventsMap={eventsMap} selectedDate={selected}
                    onSelect={setSelected}
                    onCreate={(d) => setModal({ initialDate: d })}
                  />
                </div>
                <div className="w-72 xl:w-80 flex-shrink-0 hidden lg:flex flex-col gap-4">
                  <Sidebar selectedDate={selected} eventsMap={eventsMap} allEvents={events}
                    onEdit={(ev) => setModal({ event: ev })} onDelete={askDelete}
                    onCreate={(d) => setModal({ initialDate: d })} />
                </div>
              </div>
            )}

            {view === 'planning' && (
              <PlanningView
                events={events}
                planningDate={planningDate}
                onDateChange={setPlanningDate}
                onEdit={(ev) => setModal({ event: ev })}
                onCreate={(extra) => setModal({ initialDate: extra.date, event: { startTime: extra.startTime, endTime: extra.endTime, room: extra.room, category: 'work', title: '', description: '', location: '', date: extra.date } })}
              />
            )}

            {view === 'list' && (
              <ListView events={events}
                onEdit={(ev) => setModal({ event: ev })} onDelete={askDelete}
                onCreate={(d) => setModal({ initialDate: d })} searchQuery={searchQuery} />
            )}

            {/* Panneau latéral mobile (calendrier) */}
            {view === 'calendar' && (
              <div className="lg:hidden mt-6">
                <Sidebar
                  selectedDate={selected}
                  eventsMap={eventsMap}
                  allEvents={events}
                  onEdit={(ev) => setModal({ event: ev })}
                  onDelete={askDelete}
                  onCreate={(d) => setModal({ initialDate: d })}
                />
              </div>
            )}
          </main>

          {/* ── MODAL CRÉER / MODIFIER ── */}
          {modal && (
            <EventModal
              event={modal.event}
              initialDate={modal.initialDate}
              onSave={handleSave}
              onClose={() => setModal(null)}
            />
          )}

          {/* ── MODAL CONFIRMATION SUPPRESSION ── */}
          {deleteConfirm && (
            <div className="modal-bg fixed inset-0 z-50 flex items-center justify-center p-4"
              style={{ background: 'rgba(15,23,42,0.6)' }}
              onClick={() => setDeleteConfirm(null)}>
              <div className="modal-box bg-white rounded-2xl shadow-2xl p-6 w-full max-w-sm"
                onClick={e => e.stopPropagation()}>
                <div className="w-12 h-12 rounded-2xl flex items-center justify-center mx-auto mb-4" style={{ background: '#fef2f2' }}>
                  <IcoTrash size={22} className="text-red-500" />
                </div>
                <h3 className="font-bold text-slate-900 text-center text-lg mb-1">Supprimer l'événement</h3>
                <p className="text-sm text-slate-500 text-center mb-6">Cette action est irréversible.</p>
                <div className="flex gap-3">
                  <button onClick={() => setDeleteConfirm(null)}
                    className="flex-1 py-2.5 border text-slate-600 text-sm font-semibold rounded-xl hover:bg-slate-50 transition-colors"
                    style={{ borderColor: '#e2e8f0' }}>
                    Annuler
                  </button>
                  <button onClick={() => handleDelete(deleteConfirm)}
                    className="flex-1 py-2.5 bg-red-500 text-white text-sm font-semibold rounded-xl hover:bg-red-600 transition-colors">
                    Supprimer
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    /* ── MOUNT ── */
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
